services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: ./app

    expose:
      - "5000"

    deploy:
      replicas: 3

    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_DB=urlshortener
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=urlshortener
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  k6:
    image: grafana/k6:2.2.0
    profiles:
      - load-test
    volumes:
      - ./load-tests:/scripts:ro
    environment:
      - BASE_URL=http://nginx
    depends_on:
      - nginx

volumes:
  postgres_data:

    # Bu dosya 5 servisten oluşur; k6 yalnızca load-test profiliyle opt-in çalışır:
#
# nginx:
#   Dışarıdan gelen HTTP trafiğinin giriş noktasıdır. Host makinede 80 portunu
#   yayınlar ve tüm istekleri Docker ağı üzerinden web:5000 adresine iletir.
#
# web:
#   Flask API servisidir. ./app klasöründen tek bir image build edilir ve bu
#   image'dan 3 replica çalışır. Replicalar yalnızca Docker ağı içinde 5000
#   portundan erişilir; aynı PostgreSQL ve Redis servislerini paylaşırlar.
#
# db:
#   PostgreSQL veritabanıdır. URL eşleşmelerini kalıcı olarak saklar.
#   pg_isready healthcheck'i ile bağlantı kabul etmeye hazır olup olmadığı kontrol edilir.
#
# redis:
#   Hızlı URL sorgulamaları için cache olarak kullanılır.
#   redis-cli ping komutu ile servisin hazır olduğu kontrol edilir.
#
# k6:
#   load-test profiline bağlı opt-in yük testi çalıştırıcısıdır; normal
#   docker compose up sırasında başlamaz.
#
# depends_on + condition: service_healthy:
#   Flask API'nin PostgreSQL ve Redis tamamen hazır olmadan
#   başlamasını engeller.
