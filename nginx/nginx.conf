# Bu dosya NGINX'i uygulamanın tek HTTP giriş noktası ve load balancer'ı yapar.
# İstemci Flask'a doğrudan bağlanmaz; istek önce NGINX'e, ardından web
# replikalarından birine gider:
# Client -> NGINX:80 -> Docker ağı -> web replica 1/2/3:5000

# 127.0.0.11, Docker container'larının kullandığı dahili DNS resolver adresidir.
# "web" servis adının replica IP'lerine yeniden çözülebilmesini sağlar.
resolver 127.0.0.11 valid=10s ipv6=off;

# Upstream, NGINX'in istek gönderebileceği backend havuzunu tanımlar.
upstream flask_backend {
    # Runtime DNS çözümlemesinin durumunu worker process'leri arasında paylaşır.
    zone flask_backend 64k;

    # "resolve", web servisinin DNS kayıtlarını çalışma sırasında takip eder.
    # Docker DNS birden fazla replica IP'si döndürdüğünde her IP ayrı backend olur.
    # Başka bir algoritma belirtilmediği için varsayılan strateji round-robin'dir.
    server web:5000 resolve;
}

server {
    # NGINX container içinde HTTP isteklerini 80 portundan dinler.
    # Host tarafındaki 80:80 eşlemesi docker-compose.yml içinde yapılır.
    listen 80;

    # "_" özel bir domain değildir; bu örnekte eşleşmeyen tüm host adları için
    # kullanılacak varsayılan sunucu bloğunu ifade eden yaygın bir yer tutucudur.
    server_name _;

    # "/" ile başlayan location bütün uygulama yollarını kapsar.
    # Böylece /health, /shorten ve /<short_code> aynı şekilde Flask'a aktarılır.
    location / {
        # İsteği yukarıda tanımlanan Flask backend havuzuna gönderir.
        proxy_pass http://flask_backend;

        # Yanıta isteği işleyen upstream'in IP:port bilgisini ekler. Bu header
        # yalnızca Milestone 2'de round-robin dağılımını gözlemlemek içindir;
        # Flask uygulamasının response body veya route davranışını değiştirmez.
        add_header X-Upstream-Addr $upstream_addr always;

        # Upstream bağlantısında HTTP/1.1 kullanır; keep-alive gibi modern proxy
        # davranışları için uygun bir temel sağlar.
        proxy_http_version 1.1;

        # Orijinal Host bilgisini Flask'a iletir.
        proxy_set_header Host $host;

        # NGINX'in gördüğü istemci IP'sini ayrı bir header olarak iletir.
        proxy_set_header X-Real-IP $remote_addr;

        # İstek birden fazla proxy'den geçmişse mevcut zincire istemci IP'sini ekler.
        # Flask yalnızca bu NGINX proxy hop'unu güvenilir kabul eder.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # İstemcinin NGINX'e HTTP mi HTTPS mi kullandığını upstream'e bildirir.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
